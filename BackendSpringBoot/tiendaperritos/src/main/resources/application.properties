spring.application.name=tiendaperritos

server.port=${SERVER_PORT:3001}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_perritos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/68bee24c-011a-4ac8-9431-be3cb31ef149/
spring.security.oauth2.resourceserver.jwt.audiences=api://3a8873bb-4173-46a4-a8d3-880d2c0c5c9d

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5674,localhost:5675}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=/

# Notificaciones
app.mensajeria.notificaciones.exchange=tienda.notificaciones.exchange
app.mensajeria.notificaciones.queue=tienda.notificaciones.queue
app.mensajeria.notificaciones.routing-key=notificacion.enviar
app.mensajeria.notificaciones.dlx=tienda.notificaciones.dlx
app.mensajeria.notificaciones.dlq=tienda.notificaciones.dlq
app.mensajeria.notificaciones.dlq-routing-key=notificacion.fallida

# Tickets
app.mensajeria.tickets.exchange=tienda.tickets.exchange
app.mensajeria.tickets.queue=tienda.tickets.queue
app.mensajeria.tickets.routing-key=ticket.generar
app.mensajeria.tickets.dlx=tienda.tickets.dlx
app.mensajeria.tickets.dlq=tienda.tickets.dlq
app.mensajeria.tickets.dlq-routing-key=ticket.fallido

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
app.mensajeria.max-reintentos=3


# Kafka: el backend corre en el host y usa los listeners externos de Docker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094}
spring.kafka.admin.fail-fast=false
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.batch-size=32768
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.compression.type=snappy
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=tienda-productos-auditoria
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.cloudnative.tiendaperritos.kafka.eventos
spring.kafka.consumer.properties.spring.json.value.default.type=com.cloudnative.tiendaperritos.kafka.eventos.ProductoEvento
spring.kafka.streams.application-id=tienda-stream-alertas-stock
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
app.kafka.topics.product-events=tienda.productos.eventos
app.kafka.topics.stock-alerts=tienda.productos.alertas-stock
app.kafka.topics.product-events-dlt=tienda.productos.eventos.DLT
app.kafka.minimum-stock-alert=5
app.kafka.lab.consumer-delay-ms=10
