spring.application.name=tiendaperritos

server.port=3001

spring.datasource.url=jdbc:mysql://localhost:3306/tienda_perritos
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/68bee24c-011a-4ac8-9431-be3cb31ef149/
spring.security.oauth2.resourceserver.jwt.audiences=api://3a8873bb-4173-46a4-a8d3-880d2c0c5c9d

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Notificaciones
app.mensajeria.notificaciones.exchange=tienda.notificaciones.exchange
app.mensajeria.notificaciones.queue=tienda.notificaciones.queue
app.mensajeria.notificaciones.routing-key=notificacion.enviar
app.mensajeria.notificaciones.dlx=tienda.notificaciones.dlx
app.mensajeria.notificaciones.dlq=tienda.notificaciones.dlq
app.mensajeria.notificaciones.dlq-routing-key=notificacion.fallida

# Tickets
app.mensajeria.tickets.exchange=tienda.tickets.exchange
app.mensajeria.tickets.queue=tienda.tickets.queue
app.mensajeria.tickets.routing-key=ticket.generar
app.mensajeria.tickets.dlx=tienda.tickets.dlx
app.mensajeria.tickets.dlq=tienda.tickets.dlq
app.mensajeria.tickets.dlq-routing-key=ticket.fallido

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
app.mensajeria.max-reintentos=3

